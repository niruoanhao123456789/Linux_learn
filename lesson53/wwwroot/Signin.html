<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户注册 · 简约版</title>
    <style>
        /* ----- 全局重置 & 字体 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f1a;
            background-image: radial-gradient(ellipse at 30% 20%, #1e2844, #0b0f1a 75%);
            padding: 1.5rem;
            position: relative;
        }

        /* ----- 背景粒子画布 (轻量) ----- */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            z-index: 0;
            opacity: 0.5;
        }

        /* ----- 注册卡片 ----- */
        .register-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            background: rgba(18, 25, 45, 0.7);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 2.5rem 1rem 2.5rem 1rem;
            padding: 2.5rem 2rem 2.2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: transform 0.3s ease, box-shadow 0.4s;
        }

        .register-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 70px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 200, 120, 0.08);
        }

        /* ----- 头部 ----- */
        .register-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .register-header .logo-icon {
            font-size: 2.6rem;
            display: inline-block;
            background: linear-gradient(145deg, #6bcbff, #4a9eff);
            width: 70px;
            height: 70px;
            line-height: 70px;
            border-radius: 30px 8px 30px 8px;
            color: #0b0f1a;
            box-shadow: 0 10px 24px rgba(74, 158, 255, 0.25);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .register-header h1 {
            font-size: 1.9rem;
            font-weight: 600;
            color: #f0ece4;
            letter-spacing: -0.5px;
        }

        .register-header p {
            color: #a5b3cf;
            font-size: 0.95rem;
            margin-top: 4px;
            opacity: 0.8;
        }

        /* ----- 表单元素 ----- */
        .form-group {
            margin-bottom: 1.3rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #c8d2e8;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            transition: border-color 0.25s, background 0.25s;
            padding: 0 1.2rem;
        }

        .input-wrap:focus-within {
            border-color: rgba(74, 158, 255, 0.5);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 0 3px rgba(74, 158, 255, 0.08);
        }

        .input-wrap .input-icon {
            color: #6a7fa0;
            font-size: 1.2rem;
            margin-right: 10px;
            opacity: 0.7;
            user-select: none;
        }

        .input-wrap input {
            width: 100%;
            padding: 0.85rem 0.2rem 0.85rem 0;
            background: transparent;
            border: none;
            outline: none;
            color: #f0f4ff;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        .input-wrap input::placeholder {
            color: #5d6f8f;
            font-weight: 300;
            font-size: 0.95rem;
        }

        .input-wrap input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 30px #141d30 inset !important;
            -webkit-text-fill-color: #f0f4ff !important;
        }

        /* 密码强度提示 (装饰) */
        .password-hint {
            display: flex;
            justify-content: flex-end;
            margin-top: 4px;
            font-size: 0.7rem;
            color: #5d6f8f;
            letter-spacing: 0.3px;
        }

        /* 条款 */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 0.5rem 0 1.6rem;
            color: #b0bedb;
            font-size: 0.85rem;
        }

        .terms input[type="checkbox"] {
            width: 17px;
            height: 17px;
            accent-color: #4a9eff;
            border-radius: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            margin-top: 1px;
        }

        .terms a {
            color: #6bcbff;
            text-decoration: none;
            border-bottom: 1px dashed rgba(107, 203, 255, 0.2);
            transition: border-color 0.2s;
        }

        .terms a:hover {
            border-color: #6bcbff;
        }

        /* 注册按钮 */
        .btn-register {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(145deg, #6bcbff, #4a9eff);
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 700;
            color: #0b0f1a;
            box-shadow: 0 8px 24px rgba(74, 158, 255, 0.3);
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-register:hover {
            background: linear-gradient(145deg, #7fd4ff, #5aadff);
            transform: scale(1.01);
            box-shadow: 0 12px 32px rgba(74, 158, 255, 0.45);
        }

        .btn-register:active {
            transform: scale(0.97);
        }

        /* 登录引导 */
        .login-prompt {
            text-align: center;
            margin-top: 1.8rem;
            color: #8899bb;
            font-size: 0.95rem;
        }

        .login-prompt a {
            color: #6bcbff;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .login-prompt a:hover {
            border-color: #6bcbff;
        }

        /* 社交注册 (装饰) */
        .social-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.8rem 0 1rem;
            color: #4a5a78;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .social-divider::before,
        .social-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.06);
        }

        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
        }

        .social-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #bcc8e6;
            font-size: 1.2rem;
            text-decoration: none;
            transition: all 0.2s;
            backdrop-filter: blur(2px);
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(74, 158, 255, 0.3);
            color: #7fd4ff;
            transform: translateY(-2px);
        }

        /* 响应式 */
        @media (max-width: 480px) {
            .register-card {
                padding: 1.8rem 1.3rem;
            }
            .register-header h1 {
                font-size: 1.6rem;
            }
            .register-header .logo-icon {
                width: 60px;
                height: 60px;
                line-height: 60px;
                font-size: 2.2rem;
            }
            .input-wrap {
                padding: 0 1rem;
            }
            .btn-register {
                font-size: 1rem;
            }
            .terms {
                font-size: 0.8rem;
            }
        }

        @media (max-width: 380px) {
            .register-card {
                padding: 1.4rem 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- 背景粒子画布 -->
    <canvas id="bg-canvas"></canvas>

    <!-- 注册卡片 -->
    <main class="register-card" role="main" aria-label="注册面板">
        <div class="register-header">
            <div class="logo-icon">✨</div>
            <h1>创建账户</h1>
            <p>加入我们，开始你的旅程</p>
        </div>

        <!-- 注册表单 -->
        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="fullname">全名</label>
                <div class="input-wrap">
                    <span class="input-icon">👤</span>
                    <input type="text" id="fullname" placeholder="例如：张三" required autocomplete="name">
                </div>
            </div>

            <div class="form-group">
                <label for="email">电子邮箱</label>
                <div class="input-wrap">
                    <span class="input-icon">✉️</span>
                    <input type="email" id="email" placeholder="you@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <div class="input-wrap">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="password" placeholder="至少8位" required autocomplete="new-password" minlength="8">
                </div>
                <div class="password-hint">🔒 建议使用字母、数字和符号组合</div>
            </div>

            <div class="form-group">
                <label for="confirm-pwd">确认密码</label>
                <div class="input-wrap">
                    <span class="input-icon">✓</span>
                    <input type="password" id="confirm-pwd" placeholder="再次输入密码" required autocomplete="new-password" minlength="8">
                </div>
            </div>

            <div class="terms">
                <input type="checkbox" id="agreeTerms" required>
                <label for="agreeTerms">
                    我同意 <a href="#" onclick="alert('📄 服务条款 (演示)'); return false;">服务条款</a> 和 <a href="#" onclick="alert('🔒 隐私政策 (演示)'); return false;">隐私政策</a>
                </label>
            </div>

            <button type="submit" class="btn-register">
                <span>→</span> 注册
            </button>
        </form>

        <!-- 社交注册 (装饰) -->
        <div class="social-divider">或使用其他方式注册</div>
        <div class="social-icons">
            <a href="#" class="social-btn" onclick="alert('🔵 Google 注册 (演示)'); return false;">G</a>
            <a href="#" class="social-btn" onclick="alert('🔷 GitHub 注册 (演示)'); return false;">GH</a>
            <a href="#" class="social-btn" onclick="alert('🐦 Twitter 注册 (演示)'); return false;">𝕏</a>
        </div>

        <div class="login-prompt">
            已有账户？ <a href="#" onclick="alert('🔐 跳转到登录页面 (演示)'); return false;">立即登录</a>
        </div>

        <!-- 脚标 -->
        <div style="margin-top: 1.8rem; font-size: 0.6rem; text-align: center; color: #3a4a66; letter-spacing: 0.5px; opacity: 0.6; border-top: 1px solid rgba(255,255,255,0.02); padding-top: 1.2rem;">
            🚀 注册 · 演示界面
        </div>
    </main>

    <script>
        (function() {
            "use strict";

            // ---------- 轻量粒子背景 (与登录页一致) ----------
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let w, h;
            let dots = [];
            const COUNT = 55;
            const MAX_DIST = 140;
            const SPEED = 0.3;

            function resize() {
                w = window.innerWidth;
                h = window.innerHeight;
                canvas.width = w;
                canvas.height = h;
            }
            resize();
            window.addEventListener('resize', resize);

            class Dot {
                constructor() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.vx = (Math.random() - 0.5) * SPEED * 1.6;
                    this.vy = (Math.random() - 0.5) * SPEED * 1.6;
                    this.r = Math.random() * 2.2 + 0.8;
                    const hue = 210 + Math.random() * 30;
                    this.color = `hsla(${hue}, 60%, 70%, ${0.3 + Math.random() * 0.4})`;
                }
            }

            for (let i = 0; i < COUNT; i++) dots.push(new Dot());

            function drawDots() {
                ctx.clearRect(0, 0, w, h);
                for (let i = 0; i < dots.length; i++) {
                    for (let j = i + 1; j < dots.length; j++) {
                        const a = dots[i],
                            b = dots[j];
                        const dx = a.x - b.x,
                            dy = a.y - b.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < MAX_DIST) {
                            const alpha = 0.2 * (1 - dist / MAX_DIST);
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = `rgba(180, 210, 250, ${alpha})`;
                            ctx.lineWidth = 0.7;
                            ctx.stroke();
                        }
                    }
                }
                for (let d of dots) {
                    ctx.beginPath();
                    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
                    ctx.fillStyle = d.color;
                    ctx.shadowColor = 'rgba(160, 190, 255, 0.1)';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            function updateDots() {
                for (let d of dots) {
                    d.x += d.vx;
                    d.y += d.vy;
                    if (d.x < 0 || d.x > w) { d.vx *= -0.9;
                        d.x = Math.min(Math.max(d.x, 2), w - 2); }
                    if (d.y < 0 || d.y > h) { d.vy *= -0.9;
                        d.y = Math.min(Math.max(d.y, 2), h - 2); }
                    if (Math.random() < 0.008) {
                        d.vx += (Math.random() - 0.5) * 0.15;
                        d.vy += (Math.random() - 0.5) * 0.15;
                        const sp = Math.hypot(d.vx, d.vy);
                        if (sp > SPEED * 1.4) {
                            d.vx = (d.vx / sp) * SPEED * 1.2;
                            d.vy = (d.vy / sp) * SPEED * 1.2;
                        }
                    }
                }
            }

            function loop() {
                updateDots();
                drawDots();
                requestAnimationFrame(loop);
            }
            loop();

            window.addEventListener('resize', () => {
                resize();
                for (let d of dots) {
                    d.x = Math.min(Math.max(d.x, 10), w - 10);
                    d.y = Math.min(Math.max(d.y, 10), h - 10);
                }
            });

            // ---------- 注册处理 (模拟) ----------
            window.handleRegister = function(e) {
                e.preventDefault();

                const fullname = document.getElementById('fullname').value.trim();
                const email = document.getElementById('email').value.trim();
                const pwd = document.getElementById('password').value;
                const confirmPwd = document.getElementById('confirm-pwd').value;
                const agree = document.getElementById('agreeTerms').checked;

                // 基础校验
                if (!fullname || fullname.length < 2) {
                    alert('👤 请填写你的全名 (至少2个字符)');
                    return;
                }
                if (!email || !email.includes('@') || !email.includes('.')) {
                    alert('📧 请输入有效的邮箱地址');
                    return;
                }
                if (pwd.length < 8) {
                    alert('🔐 密码至少需要8位字符');
                    return;
                }
                if (pwd !== confirmPwd) {
                    alert('⚠️ 两次输入的密码不一致');
                    return;
                }
                if (!agree) {
                    alert('📄 请先同意服务条款和隐私政策');
                    return;
                }

                // 模拟注册成功
                alert(`🎉 注册成功！\n姓名: ${fullname}\n邮箱: ${email}\n(演示交互，无真实后端)`);

                // 可重定向到登录页
                // window.location.href = "/login";
            };

            console.log('✨ 注册页面已加载 (粒子背景 + 模拟注册)');
        })();
    </script>
</body>
</html>
