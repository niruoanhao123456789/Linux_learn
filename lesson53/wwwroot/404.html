<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · 页面未找到</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0e1a;
            background-image: radial-gradient(circle at 20% 30%, #1a1f33 0%, #0b0e1a 80%);
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            pointer-events: none;
            z-index: 0;
        }
        .error-card {
            position: relative;
            z-index: 10;
            max-width: 680px;
            width: 100%;
            background: rgba(18, 23, 42, 0.65);
            backdrop-filter: blur(12px) saturate(180%);
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            border-radius: 3rem 1rem 3rem 1rem;
            padding: 3rem 2.8rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.04);
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: transform 0.25s ease, box-shadow 0.3s;
            cursor: pointer;
        }
        .error-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 40px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 215, 100, 0.15);
        }
        .glitch-title {
            font-size: 7rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: 0.04em;
            color: #f0eae3;
            text-shadow: 0 0 8px rgba(255, 200, 100, 0.3), 0 0 20px rgba(255, 140, 50, 0.2);
            margin-bottom: 0.2rem;
            position: relative;
            display: inline-block;
        }
        .glitch-title::before,
        .glitch-title::after {
            content: "404";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.6;
            pointer-events: none;
        }
        .glitch-title::before {
            color: #ff7b9c;
            z-index: -1;
            transform: translate(-4px, -2px);
            text-shadow: 0 0 12px #ff3b6f;
        }
        .glitch-title::after {
            color: #6bcbff;
            z-index: -2;
            transform: translate(6px, 4px);
            text-shadow: 0 0 16px #3b9eff;
        }
        .sub-message {
            font-size: 1.3rem;
            font-weight: 400;
            color: #cfd7e6;
            background: rgba(255, 255, 255, 0.03);
            padding: 0.6rem 1.4rem;
            border-radius: 60px;
            display: inline-block;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin-top: 0.2rem;
            margin-bottom: 1.8rem;
            letter-spacing: 0.3px;
        }
        .description {
            color: #b6c2d9;
            font-size: 1.05rem;
            line-height: 1.7;
            max-width: 440px;
            margin: 0 auto 2.2rem;
            opacity: 0.9;
        }
        .description span {
            display: inline-block;
            background: rgba(255, 215, 100, 0.08);
            padding: 0.1rem 0.7rem;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 100, 0.15);
            color: #f5d78e;
        }
        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1rem 1.2rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.8rem 2.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #eef3fc;
            text-decoration: none;
            transition: all 0.25s ease;
            backdrop-filter: blur(4px);
            cursor: pointer;
            min-width: 140px;
            letter-spacing: 0.3px;
        }
        .btn-primary {
            background: linear-gradient(145deg, #f5b56b, #e8924b);
            border: none;
            color: #0f1422;
            box-shadow: 0 6px 18px rgba(232, 146, 75, 0.25);
            font-weight: 700;
        }
        .btn-primary:hover {
            background: linear-gradient(145deg, #ffc583, #f09d52);
            transform: scale(1.02);
            box-shadow: 0 10px 28px rgba(232, 146, 75, 0.4);
            color: #0a0e1a;
        }
        .btn-outline {
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.02);
        }
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: #f5b56b;
            color: #f5d78e;
            transform: scale(1.02);
        }
        .btn-icon {
            font-size: 1.2rem;
            line-height: 1;
        }
        .search-mock {
            margin-top: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .search-mock:hover {
            opacity: 0.9;
        }
        .search-mock input {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            color: #bcc8e0;
            font-size: 0.9rem;
            width: 200px;
            outline: none;
            backdrop-filter: blur(4px);
            transition: 0.2s;
        }
        .search-mock input::placeholder {
            color: #6a7a99;
            font-weight: 300;
            letter-spacing: 0.3px;
        }
        .search-mock input:focus {
            border-color: rgba(245, 181, 107, 0.3);
            background: rgba(255, 255, 255, 0.07);
        }
        .search-mock span {
            color: #6a7a99;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.02);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .footer-note {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: #3a4560;
            letter-spacing: 1px;
            opacity: 0.6;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            padding-top: 1.2rem;
        }
        @media (max-width: 540px) {
            .error-card {
                padding: 2.2rem 1.5rem;
            }
            .glitch-title {
                font-size: 4.8rem;
            }
            .sub-message {
                font-size: 1rem;
                padding: 0.4rem 1.2rem;
            }
            .description {
                font-size: 0.95rem;
            }
            .btn {
                min-width: 120px;
                padding: 0.7rem 1.4rem;
            }
            .search-mock input {
                width: 140px;
            }
        }
        @media (max-width: 400px) {
            .glitch-title {
                font-size: 3.8rem;
            }
        }
    </style>
</head>
<body>
    <canvas id="particle-canvas"></canvas>
    <main class="error-card" role="main">
        <h1 class="glitch-title" aria-label="404">404</h1>
        <div class="sub-message">✨ 页面偷偷溜走了 ✨</div>
        <p class="description">
            您请求的页面不在这个星系。<br>
            或许它去度假了，或者<span>URL</span> 写错啦。
        </p>
        <div class="actions">
            <a href="#" class="btn btn-primary" onclick="alert('🚀 即将带您返回首页'); return false;">
                <span class="btn-icon">🏠</span> 返回首页
            </a>
            <a href="#" class="btn btn-outline" onclick="alert('🔍 模拟搜索功能'); return false;">
                <span class="btn-icon">🔎</span> 搜索页面
            </a>
        </div>
        <div class="search-mock">
            <input type="text" placeholder="输入你想找的…" aria-label="搜索占位">
            <span>⌘K</span>
        </div>
        <div class="footer-note">⚡ 404 · 粒子宇宙</div>
    </main>
    <script>
        (function() {
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const COUNT = 75;
            const CONN_DIST = 130;
            const MAX_SPD = 0.45;

            function resize() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.vx = (Math.random() - 0.5) * MAX_SPD * 1.2;
                    this.vy = (Math.random() - 0.5) * MAX_SPD * 1.2;
                    this.r = Math.random() * 2.5 + 1.2;
                    const h = 40 + Math.random() * 20;
                    this.color = `hsla(${h}, 70%, 70%, ${0.4 + Math.random() * 0.5})`;
                }
            }

            function init() {
                particles = [];
                for (let i = 0; i < COUNT; i++) particles.push(new Particle());
            }

            function update() {
                for (let p of particles) {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > width) { p.vx *= -0.9;
                        p.x = Math.min(Math.max(p.x, 2), width - 2); }
                    if (p.y < 0 || p.y > height) { p.vy *= -0.9;
                        p.y = Math.min(Math.max(p.y, 2), height - 2); }
                    if (Math.random() < 0.01) {
                        p.vx += (Math.random() - 0.5) * 0.2;
                        p.vy += (Math.random() - 0.5) * 0.2;
                        const sp = Math.hypot(p.vx, p.vy);
                        if (sp > MAX_SPD) { p.vx = (p.vx / sp) * MAX_SPD;
                            p.vy = (p.vy / sp) * MAX_SPD; }
                    }
                }
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const a = particles[i],
                            b = particles[j];
                        const dx = a.x - b.x,
                            dy = a.y - b.y;
                        const dist = Math.hypot(dx, dy);
                        if (dist < CONN_DIST) {
                            const alpha = 0.25 * (1 - dist / CONN_DIST);
                            ctx.beginPath();
                            ctx.moveTo(a.x, a.y);
                            ctx.lineTo(b.x, b.y);
                            ctx.strokeStyle = `rgba(210, 220, 245, ${alpha})`;
                            ctx.lineWidth = 0.8;
                            ctx.stroke();
                        }
                    }
                }
                for (let p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = 'rgba(255, 210, 150, 0.2)';
                    ctx.shadowBlur = 10;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            }

            function loop() {
                update();
                draw();
                requestAnimationFrame(loop);
            }

            resize();
            init();
            loop();

            window.addEventListener('resize', () => {
                resize();
                for (let p of particles) {
                    p.x = Math.min(Math.max(p.x, 10), width - 10);
                    p.y = Math.min(Math.max(p.y, 10), height - 10);
                }
            });

            document.querySelector('.error-card').addEventListener('click', function() {
                for (let p of particles) {
                    p.vx += (Math.random() - 0.5) * 0.6;
                    p.vy += (Math.random() - 0.5) * 0.6;
                    const sp = Math.hypot(p.vx, p.vy);
                    if (sp > MAX_SPD * 1.6) {
                        p.vx = (p.vx / sp) * MAX_SPD * 1.2;
                        p.vy = (p.vy / sp) * MAX_SPD * 1.2;
                    }
                }
            });
        })();
    </script>
</body>
</html>
