<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
            background:linear-gradient(145deg,#f5f7fc 0%,#eef2f7 100%);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:20px;
        }
        .error-box{
            max-width:550px;
            width:100%;
            background:#fff;
            border-radius:36px;
            box-shadow:0 20px 40px rgba(0,0,0,0.08);
            padding:40px 32px 48px;
            text-align:center;
        }
        .code{
            font-size:110px;
            font-weight:800;
            background:linear-gradient(135deg,#3b82b6,#1e4a76);
            background-clip:text;
            -webkit-background-clip:text;
            color:transparent;
            line-height:1;
            letter-spacing:8px;
        }
        h2{
            font-size:26px;
            color:#1f2e3a;
            margin:16px 0 12px;
            font-weight:600;
        }
        .msg{
            color:#5b7b91;
            font-size:15px;
            margin-bottom:28px;
            padding:0 16px;
        }
        .btns{
            display:flex;
            flex-wrap:wrap;
            justify-content:center;
            gap:12px;
            margin-bottom:32px;
        }
        .btn{
            display:inline-block;
            padding:10px 24px;
            border-radius:40px;
            text-decoration:none;
            font-size:14px;
            font-weight:500;
            transition:all 0.2s;
        }
        .btn-primary{
            background:#1f5f8e;
            color:#fff;
            box-shadow:0 4px 10px rgba(31,95,142,0.2);
        }
        .btn-primary:hover{
            background:#0f476b;
            transform:translateY(-2px);
        }
        .btn-outline{
            background:#fff;
            color:#1f5f8e;
            border:1px solid #cbdde9;
        }
        .btn-outline:hover{
            background:#eef4fa;
            border-color:#8bb3cc;
        }
        .search-area{
            border-top:1px solid #e5edf3;
            padding-top:28px;
        }
        .search-wrapper{
            display:flex;
            max-width:380px;
            margin:12px auto 0;
            border:1px solid #dce5ec;
            border-radius:60px;
            overflow:hidden;
            background:#fff;
        }
        .search-input{
            flex:1;
            border:none;
            padding:10px 18px;
            font-size:14px;
            outline:none;
        }
        .search-btn{
            background:#f5f9fe;
            border:none;
            padding:0 20px;
            cursor:pointer;
            color:#1f5f8e;
            font-weight:500;
        }
        .search-btn:hover{
            background:#e6f0f9;
        }
        .funny{
            font-size:12px;
            color:#8aa9bc;
            margin-top:28px;
        }
        @media (prefers-color-scheme: dark){
            body{background:linear-gradient(145deg,#1a242c,#0f161c);}
            .error-box{background:#1e2a32;box-shadow:0 20px 40px rgba(0,0,0,0.3);}
            h2{color:#d5e6f0;}
            .msg{color:#b0c8da;}
            .btn-outline{background:#1e2a32;color:#8fc5e5;border-color:#3a5a6e;}
            .btn-outline:hover{background:#253b47;}
            .search-wrapper{background:#1e2a32;border-color:#3a5a6e;}
            .search-input{background:#1e2a32;color:#e0eef7;}
            .search-btn{background:#253b47;color:#bfdeff;}
            .search-area{border-top-color:#2c4454;}
            .funny{color:#6f91a8;}
        }
    </style>
</head>
<body>
<div class="error-box">
    <div class="code">404</div>
    <h2>📖 页面走丢了</h2>
    <div class="msg">你访问的内容可能已被移动、删除，或从未存在过～</div>
    <div class="btns">
        <a href="/" class="btn btn-primary">🏠 返回首页</a>
        <a href="/archive" class="btn btn-outline">📂 文章归档</a>
    </div>
    <div class="search-area">
        <div style="font-size:13px; color:#6f8ea2;">🔍 站内搜索试试</div>
        <div class="search-wrapper">
            <input type="text" class="search-input" id="searchInput" placeholder="输入关键词...">
            <button class="search-btn" id="searchBtn">搜索</button>
        </div>
    </div>
    <div class="funny">✨ 不妨去首页看看，也许有意外收获</div>
</div>
<script>
    function searchSite(){
        let kw = document.getElementById('searchInput').value.trim();
        if(!kw){ alert('请输入关键词'); return; }
        let host = window.location.hostname;
        let isGoogle = confirm('使用 Google 搜索站内内容？\n(点“取消”将使用百度)');
        let url = isGoogle 
            ? `https://www.google.com/search?q=site:${host}+${encodeURIComponent(kw)}`
            : `https://www.baidu.com/s?wd=site:${host}+${encodeURIComponent(kw)}`;
        window.open(url, '_blank');
    }
    document.getElementById('searchBtn').onclick = searchSite;
    document.getElementById('searchInput').onkeypress = function(e){ if(e.key === 'Enter') searchSite(); };
</script>
</body>
</html>
